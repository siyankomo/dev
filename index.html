<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💘</title>

<style>
  body {
    background: #ffd6e8;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }

  .card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    width: 300px;
    position: relative;
  }

  button {
    padding: 12px 20px;
    border-radius: 25px;
    border: none;
    font-size: 16px;
    cursor: pointer;
  }

  #yes {
    background: #ff4d6d;
    color: white;
  }

  #no {
    position: absolute;
    background: #ccc;
  }
</style>
</head>

<body>
  <div class="card">
    <h2>Will you be my Valentine? 💕</h2>
    <br>
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");

  noBtn.addEventListener("click", () => {
    const x = Math.random() * 200;
    const y = Math.random() * 200;
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
      <div style="
        background:#ffd6e8;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:30px;
      ">
        YAYYY!!! 🎉💖
      </div>
    `;
  });
</script>

</body>
</html>
